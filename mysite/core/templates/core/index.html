{% extends "base.html" %}

{% block content %}
    <div>
        <h1>Последние вакансии</h1>
        <p><a href="{% url 'post_create' %}">Создать запись</a></p>
        <div class="posts">
            {% for post in posts %}
                <div class="post">
                    <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
                    <p>{{ post.content }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
